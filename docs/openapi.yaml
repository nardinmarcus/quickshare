  "components": {
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key",
        "description": "Managed or legacy API Key. Legacy Keys are create-only."
      }
    },
    "schemas": {
      "Identity": {
        "type": "object",
        "required": [
          "success",
          "origin",
          "credentialKind",
          "scopes"
        ],
        "properties": {
          "success": {
            "const": true
          },
          "origin": {
            "type": "string",
            "format": "uri"
          },
          "credentialKind": {
            "type": "string",
            "enum": [
              "legacy",
              "managed"
            ]
          },
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "credentialVersion": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "share:create",
                "share:read",
                "share:update",
                "share:publish"
              ]
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "required": [
          "success",
          "protocolVersion",
          "contentTypes",
          "markdownThemePresets",
          "limits",
          "operations",
          "scopes",
          "idempotency"
        ],
        "properties": {
          "success": {
            "const": true
          },
          "protocolVersion": {
            "const": "1"
          },
          "contentTypes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "html",
                "markdown",
                "svg",
                "mermaid"
              ]
            }
          },
          "markdownThemePresets": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "bytedance",
                "github",
                "apple",
                "notion",
                "claude",
                "raycast",
                "google",
                "tesla",
                "airbnb",
                "bugatti",
                "linear",
                "playstation"
              ]
            }
          },
          "limits": {
            "$ref": "#/components/schemas/Limits"
          },
          "operations": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "method",
                "path"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "method": {
                  "type": "string"
                },
                "path": {
                  "type": "string"
                }
              }
            }
          },
          "scopes": {
            "type": "object"
          },
          "idempotency": {
            "type": "object"
          }
        }
      },
      "ShareState": {
        "type": "object",
        "required": [
          "success",
          "id",
          "published",
          "isProtected",
          "expiresAt",
          "accessRevision"
        ],
        "additionalProperties": false,
        "properties": {
          "success": {
            "const": true
          },
          "id": {
            "type": "string"
          },
          "published": {
            "type": "boolean"
          },
          "isProtected": {
            "type": "boolean"
          },
          "expiresAt": {
            "type": [
              "integer",
              "null"
            ]
          },
          "accessRevision": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          }
        }
      },
      "PublishStateResult": {
        "oneOf": [
          {
            "type": "object",
            "required": [
              "success",
              "action",
              "requestId",
              "changed",
              "id",
              "published",
              "isProtected",
              "expiresAt",
              "accessRevision"
            ],
            "properties": {
              "success": {
                "const": true
              },
              "action": {
                "type": "string",
                "enum": [
                  "unpublish",
                  "republish"
                ]
              },
              "requestId": {
                "type": "string"
              },
              "changed": {
                "type": "boolean"
              },
              "id": {
                "type": "string"
              },
              "published": {
                "type": "boolean"
              },
              "isProtected": {
                "type": "boolean"
              },
              "expiresAt": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "accessRevision": {
                "type": "string",
                "pattern": "^[1-9][0-9]*$"
              },
              "replayed": {
                "type": "boolean"
              }
            }
          },
          {
            "type": "object",
            "required": [
              "success",
              "action",
              "requestId",
              "changed",
              "replayed",
              "stateChangedSinceCommit"
            ],
            "properties": {
              "success": {
                "const": true
              },
              "action": {
                "type": "string",
                "enum": [
                  "unpublish",
                  "republish"
                ]
              },
              "requestId": {
                "type": "string"
              },
              "changed": {
                "type": "boolean"
              },
              "replayed": {
                "const": true
              },
              "stateChangedSinceCommit": {
                "const": true
              }
            },
            "additionalProperties": false
          }
        ]
      },
      "Error": {
        "type": "object",
        "required": [
          "success",
          "code",
          "retryable",
          "error"
        ],
        "properties": {
          "success": {
            "const": false
          },
          "code": {
            "type": "string"
          },
          "requestId": {
            "type": [
              "string",
              "null"
            ]
          },
          "retryable": {
            "type": "boolean"
          },
          "error": {
            "type": "string"
          }
        }
      },
      "ReadUnavailable": {
        "type": "object",
        "required": [
          "success",
          "code",
          "requestId",
          "retryable",
          "error"
        ],
        "additionalProperties": false,
        "properties": {
          "success": {
            "const": false
          },
          "code": {
            "const": "API_READ_UNAVAILABLE"
          },
          "requestId": {
            "type": "null"
          },
          "retryable": {
            "const": true
          },
          "error": {
            "type": "string"
          }
        }
      },
      "Limits": {
        "type": "object",
        "required": [
          "shareRequestBodyBytes",
          "smallRequestBodyBytes",
          "rawContentBytes"
        ],
        "properties": {
          "shareRequestBodyBytes": {
            "type": "integer",
            "minimum": 1,
            "description": "Configured decoded JSON request-body limit; query GET /api/v1/capabilities for this instance."
          },
          "smallRequestBodyBytes": {
            "type": "integer",
            "minimum": 1,
            "description": "Configured decoded small JSON request-body limit; query GET /api/v1/capabilities for this instance."
          },
          "rawContentBytes": {
            "type": "null",
            "description": "No independent raw content byte allowance."
          }
        }
      }
    }
  },
  "x-quickshare-capabilities": {
    "protocolVersion": "1",
    "contentTypes": [
      "html",
      "markdown",
      "svg",
      "mermaid"
    ],
    "markdownThemePresets": [
      "bytedance",
      "github",
      "apple",
      "notion",
      "claude",
      "raycast",
      "google",
      "tesla",
      "airbnb",
      "bugatti",
      "linear",
      "playstation"
    ],
    "scopes": {
      "implemented": [
        "share:create",
        "share:read",
        "share:update",
        "share:publish"
      ],
      "notImplemented": []
    },
    "idempotency": {
      "header": "Idempotency-Key",
      "pattern": "^[A-Za-z0-9_-]{16,128}$",
      "appliesTo": [
        "share:create",
        "share:content:update",
        "share:restore",
        "share:unpublish",
        "share:republish"
      ],
      "conflictStatus": 409,
      "replayRequiresSameInput": true
    }
  }
