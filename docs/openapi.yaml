{
  "openapi": "3.1.0",
  "info": {
    "title": "QuickShare Share API (implemented subset)",
    "version": "1",
    "description": "This document covers the public /api/v1 Share API operations currently exposed by this repository. It is not a complete schema for every QuickShare route; dashboard, legacy /api/pages, public view, private client-maintenance actions and Key/history purge are intentionally excluded."
  },
  "paths": {
    "/api/v1/share": {
      "post": {
        "operationId": "createShare",
        "summary": "Create a Share",
        "description": "Creates a Share. Idempotency-Key is optional for legacy compatibility; when supplied, a matching replay confirms the original result.",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "x-quickshare-capability": {
          "id": "share:create",
          "method": "POST",
          "path": "/api/v1/share",
          "scope": "share:create"
        },
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "htmlContent"
                ],
                "additionalProperties": false,
                "properties": {
                  "htmlContent": {
                    "type": "string",
                    "minLength": 1
                  },
                  "codeType": {
                    "type": "string",
                    "enum": [
                      "html",
                      "markdown",
                      "svg",
                      "mermaid"
                    ]
                  },
                  "title": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "isProtected": {
                    "type": "boolean"
                  },
                  "password": {
                    "type": "string"
                  },
                  "expiresAt": {
                    "oneOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "string",
                        "pattern": "^[0-9]+$"
                      }
                    ]
                  },
                  "markdownTheme": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, invalid or revoked API Key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request body exceeds the configured parser limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The service or storage is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
