    "/api/v1/shares/{id}/content": {
      "get": {
        "operationId": "getShareContent",
        "summary": "Read current Share content",
        "description": "Requires share:read and can_read for this Share. Returns the current content snapshot and a strong content ETag.",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "x-quickshare-capability": {
          "id": "share:content:read",
          "method": "GET",
          "path": "/api/v1/shares/:id/content",
          "scope": "share:read",
          "grant": "can_read"
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Share ID.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            }
          },
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "description": "Optional cache validator; responses remain private/no-store.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "304": {
            "description": "Not modified."
          },
          "401": {
            "description": "Missing, invalid or revoked API Key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Required scope is not enabled for this credential.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Resource is missing or the matching resource grant is absent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The service or storage is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReadUnavailable"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "updateShareContent",
        "summary": "Conditionally replace Share content",
        "description": "Requires a managed Key with share:read and share:update plus can_read and can_update grants. Requires a concrete strong content If-Match and Idempotency-Key.",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "x-quickshare-capability": {
          "id": "share:content:update",
          "method": "PUT",
          "path": "/api/v1/shares/:id/content",
          "scopes": [
            "share:read",
            "share:update"
          ],
          "grants": [
            "can_read",
            "can_update"
          ]
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Share ID.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "description": "One concrete strong content ETag from the corresponding content representation.",
            "schema": {
              "type": "string",
              "pattern": "^\"content:[A-Za-z0-9_-]{1,64}:[1-9][0-9]*\"$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "Request identity, 16–128 ASCII letters, digits, hyphens or underscores.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "htmlContent",
                  "title",
                  "description",
                  "markdownTheme"
                ],
                "additionalProperties": false,
                "properties": {
                  "htmlContent": {
                    "type": "string",
                    "minLength": 1
                  },
                  "title": {
                    "type": [
                      "string",
                      "null"
                    ]
                  },
                  "description": {
                    "type": [
                      "string",
                      "null"
                    ]
                  },
                  "markdownTheme": {
                    "type": [
                      "string",
                      "null"
                    ]
                  },
                  "codeType": {
                    "type": "string",
                    "enum": [
                      "html",
                      "markdown",
                      "svg",
                      "mermaid"
                    ],
                    "description": "Optional; must equal the Share’s immutable type."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, invalid or revoked API Key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Required scope is not enabled for this credential.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Resource is missing or the matching resource grant is absent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Idempotency key conflicts with another request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Requested result or revision is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "412": {
            "description": "The strong If-Match validator is stale.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request body exceeds the configured parser limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "A required If-Match or Idempotency-Key is missing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The service or storage is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
