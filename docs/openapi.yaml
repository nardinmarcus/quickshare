    "/api/v1/shares/{id}/restore": {
      "post": {
        "operationId": "restoreShareRevision",
        "summary": "Conditionally restore a Share revision",
        "description": "Requires share:read and share:update plus can_read and can_update. The body contains only revision; the current content ETag is used for If-Match.",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "x-quickshare-capability": {
          "id": "share:restore",
          "method": "POST",
          "path": "/api/v1/shares/:id/restore",
          "scopes": [
            "share:read",
            "share:update"
          ],
          "grants": [
            "can_read",
            "can_update"
          ]
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Share ID.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
