          "scope": "share:create"
        },
        "parameters": [
          {
            "name": "requestId",
            "in": "path",
            "required": true,
            "description": "Credential-namespace operation identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            }
          }
        ],
        "responses": {
